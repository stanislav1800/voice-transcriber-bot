services:
  bot:
    build: .
    container_name: voice-transcriber-bot
    env_file: .env
    restart: unless-stopped
    volumes:
      - models:/models
    # Жёсткий лимит: при нехватке памяти OOM-killer убьёт этот контейнер,
    # а не VPN-сервисы на хосте. GigaAM int8 укладывается с запасом.
    mem_limit: 550m
    memswap_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  models:
